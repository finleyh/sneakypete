; Minimal override, layered on top of Cowrie's own cowrie.cfg.dist defaults.
; Ties the SSH decoy to the same fictional host as the SIP/AMI/web honeypots.

[honeypot]
hostname = pbx01

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
